<svg fill="none" viewBox="0 0 800 180" width="100%" height="180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="100%" stop-color="#140a28" />
    </linearGradient>

    <!-- Neon Text Gradient -->
    <linearGradient id="neon-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ffe600" />
    </linearGradient>

    <!-- Subtle Grid Fade -->
    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0.35" />
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000" stroke-width="1" opacity="0.3" />
    </pattern>

    <!-- Subtle Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes gridScroll {
      0% { transform: translateY(0px); }
      100% { transform: translateY(24px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .main-title {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 900;
      font-size: 32px;
      letter-spacing: 6px;
      fill: url(#neon-text);
      filter: url(#glow);
    }
    .subtitle {
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 3px;
      fill: #00f3ff;
    }
    .terminal-bar {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      fill: #a0a0b0;
    }
    .prompt-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      fill: #ff71ce;
    }
    .grid-move {
      animation: gridScroll 3s linear infinite;
    }
    .cursor-blink {
      animation: blink 1s infinite;
    }
  </style>

  <!-- Frame Background -->
  <rect width="800" height="180" rx="8" fill="url(#bg)" stroke="#ff007f" stroke-width="1.2" />

  <!-- Top Window Bar -->
  <rect width="800" height="26" rx="8" fill="#1b0e36" />
  <rect y="18" width="800" height="8" fill="#1b0e36" />
  <circle cx="18" cy="13" r="4.5" fill="#ff5f56" />
  <circle cx="32" cy="13" r="4.5" fill="#ffbd2e" />
  <circle cx="46" cy="13" r="4.5" fill="#27c93f" />
  <text x="400" y="17" text-anchor="middle" class="terminal-bar">azaan_session.sys [READY]</text>

  <!-- Clean Animated Perspective Grid in Lower Half -->
  <g opacity="0.6">
    <clipPath id="lower-clip">
      <rect x="0" y="85" width="800" height="95" />
    </clipPath>
    <g clip-path="url(#lower-clip)">
      <!-- Vanishing lines -->
      <line x1="400" y1="85" x2="-60" y2="180" stroke="#ff007f" stroke-width="1" opacity="0.4" />
      <line x1="400" y1="85" x2="100" y2="180" stroke="#ff007f" stroke-width="1" opacity="0.4" />
      <line x1="400" y1="85" x2="250" y2="180" stroke="#ff007f" stroke-width="1" opacity="0.4" />
      <line x1="400" y1="85" x2="550" y2="180" stroke="#00f3ff" stroke-width="1" opacity="0.4" />
      <line x1="400" y1="85" x2="700" y2="180" stroke="#00f3ff" stroke-width="1" opacity="0.4" />
      <line x1="400" y1="85" x2="860" y2="180" stroke="#00f3ff" stroke-width="1" opacity="0.4" />

      <!-- Horizontal scrolling lines -->
      <g class="grid-move">
        <line x1="0" y1="95" x2="800" y2="95" stroke="url(#grid-fade)" stroke-width="1" />
        <line x1="0" y1="115" x2="800" y2="115" stroke="url(#grid-fade)" stroke-width="1.2" />
        <line x1="0" y1="140" x2="800" y2="140" stroke="url(#grid-fade)" stroke-width="1.4" />
        <line x1="0" y1="170" x2="800" y2="170" stroke="url(#grid-fade)" stroke-width="1.8" />
      </g>
    </g>
  </g>

  <!-- Title & Subtitle -->
  <text x="400" y="74" text-anchor="middle" class="main-title">MUHAMMAD AZAAN</text>
  <text x="400" y="98" text-anchor="middle" class="subtitle">SOFTWARE DEVELOPER &amp; BUILDER</text>

  <!-- Command Line / Status Prompt -->
  <g transform="translate(180, 126)">
    <rect width="440" height="28" rx="4" fill="#04010a" fill-opacity="0.8" stroke="#ffe600" stroke-width="0.8" stroke-dasharray="4,4" />
    <text x="14" y="18" class="prompt-text">sys://status &gt; building practical software</text>
    <rect x="360" y="7" width="8" height="14" fill="#00f3ff" class="cursor-blink" />
  </g>

  <!-- Scanline Overlay -->
  <rect width="800" height="180" rx="8" fill="url(#scanlines)" pointer-events="none" />
</svg>
