<svg fill="none" viewBox="0 0 840 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- CRT Monitor Dark Gradient -->
    <linearGradient id="crt-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#091024" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>

    <!-- 90s Neon / Phosphor Text Gradient -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#00f3ff" />
    </linearGradient>

    <linearGradient id="neon-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <!-- 90s Wireframe Grid Gradient -->
    <linearGradient id="grid-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0" />
      <stop offset="40%" stop-color="#00f3ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0.6" />
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.3" opacity="0.35" />
    </pattern>

    <!-- Phosphor Glow Filter -->
    <filter id="crt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Continuous Grid Horizon Animation */
    @keyframes gridScroll {
      0% { transform: translateY(0px); }
      100% { transform: translateY(28px); }
    }
    
    /* Blinking Cursor */
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Scanline Sweep */
    @keyframes scanlineSweep {
      0% { transform: translateY(-100px); }
      100% { transform: translateY(260px); }
    }

    /* Ambient CRT Flicker */
    @keyframes crtFlicker {
      0%, 100% { opacity: 0.98; }
      50% { opacity: 0.93; }
      75% { opacity: 1; }
    }

    /* Phase 1: MUHAMMAD AZAAN M R */
    @keyframes text1Anim {
      0%, 2% { opacity: 0; transform: scale(0.96); }
      5%, 28% { opacity: 1; transform: scale(1); }
      31%, 100% { opacity: 0; transform: scale(0.96); }
    }

    /* Phase 2: azaanmr */
    @keyframes text2Anim {
      0%, 31% { opacity: 0; transform: scale(0.96); }
      34%, 61% { opacity: 1; transform: scale(1); }
      64%, 100% { opacity: 0; transform: scale(0.96); }
    }

    /* Phase 3: AZN LABS */
    @keyframes text3Anim {
      0%, 64% { opacity: 0; transform: scale(0.96); }
      67%, 95% { opacity: 1; transform: scale(1); }
      98%, 100% { opacity: 0; transform: scale(0.96); }
    }

    /* LED Status Indicator */
    @keyframes ledPulse {
      0%, 100% { fill: #00f3ff; filter: drop-shadow(0 0 4px #00f3ff); }
      33% { fill: #ffe600; filter: drop-shadow(0 0 4px #ffe600); }
      66% { fill: #ff007f; filter: drop-shadow(0 0 4px #ff007f); }
    }

    .crt-font {
      font-family: 'Courier New', Courier, 'Lucida Console', Monaco, monospace;
      font-weight: 900;
      text-anchor: middle;
      filter: url(#crt-glow);
    }

    .t1 {
      font-size: 32px;
      letter-spacing: 5px;
      fill: url(#neon-cyan);
      animation: text1Anim 9s infinite ease-in-out;
      transform-origin: 420px 108px;
    }

    .t2 {
      font-size: 36px;
      letter-spacing: 7px;
      fill: #ffe600;
      animation: text2Anim 9s infinite ease-in-out;
      transform-origin: 420px 108px;
    }

    .t3 {
      font-size: 36px;
      letter-spacing: 8px;
      fill: #ff007f;
      animation: text3Anim 9s infinite ease-in-out;
      transform-origin: 420px 108px;
    }

    .status-sub {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11.5px;
      font-weight: bold;
      letter-spacing: 3px;
      fill: #00f3ff;
      text-anchor: middle;
    }

    .top-bar-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      fill: #607890;
      font-weight: bold;
    }

    .grid-scrolling {
      animation: gridScroll 2.4s linear infinite;
    }

    .cursor-box {
      animation: cursorBlink 0.8s infinite;
    }

    .screen-flicker {
      animation: crtFlicker 0.15s infinite;
    }

    .led-bulb {
      animation: ledPulse 9s infinite;
    }
  </style>

  <!-- 90s CRT Monitor Frame -->
  <rect width="840" height="220" rx="14" fill="#121826" stroke="#25354d" stroke-width="2" />
  
  <!-- Inner CRT Bezel -->
  <rect x="8" y="8" width="824" height="204" rx="10" fill="url(#crt-bg)" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.4" class="screen-flicker" />

  <!-- 90s Animated Horizon Wireframe Grid -->
  <g opacity="0.6">
    <clipPath id="horizon-clip">
      <rect x="8" y="90" width="824" height="122" rx="8" />
    </clipPath>
    <g clip-path="url(#horizon-clip)">
      <!-- Vanishing Lines to Center Horizon -->
      <line x1="420" y1="90" x2="-80" y2="220" stroke="#00f3ff" stroke-width="0.8" opacity="0.4" />
      <line x1="420" y1="90" x2="80" y2="220" stroke="#00f3ff" stroke-width="0.8" opacity="0.4" />
      <line x1="420" y1="90" x2="220" y2="220" stroke="#00f3ff" stroke-width="0.8" opacity="0.4" />
      <line x1="420" y1="90" x2="340" y2="220" stroke="#00f3ff" stroke-width="0.8" opacity="0.4" />
      <line x1="420" y1="90" x2="500" y2="220" stroke="#00f3ff" stroke-width="0.8" opacity="0.4" />
      <line x1="420" y1="90" x2="620" y2="220" stroke="#00f3ff" stroke-width="0.8" opacity="0.4" />
      <line x1="420" y1="90" x2="760" y2="220" stroke="#00f3ff" stroke-width="0.8" opacity="0.4" />
      <line x1="420" y1="90" x2="920" y2="220" stroke="#00f3ff" stroke-width="0.8" opacity="0.4" />

      <!-- Horizontal Moving Grid Lines -->
      <g class="grid-scrolling">
        <line x1="8" y1="100" x2="832" y2="100" stroke="url(#grid-glow)" stroke-width="1" />
        <line x1="8" y1="120" x2="832" y2="120" stroke="url(#grid-glow)" stroke-width="1.2" />
        <line x1="8" y1="148" x2="832" y2="148" stroke="url(#grid-glow)" stroke-width="1.4" />
        <line x1="8" y1="182" x2="832" y2="182" stroke="url(#grid-glow)" stroke-width="1.8" />
        <line x1="8" y1="220" x2="832" y2="220" stroke="url(#grid-glow)" stroke-width="2.2" />
      </g>
    </g>
  </g>

  <!-- Top System Header Bar -->
  <g transform="translate(24, 28)">
    <circle cx="4" cy="0" r="3.5" class="led-bulb" />
    <text x="16" y="3.5" class="top-bar-text">AZN-DOS v3.2 // TTY_SYS: CONNECTED</text>
    <text x="792" y="3.5" text-anchor="end" class="top-bar-text">BAUD: 14400 // ROM_OK</text>
  </g>

  <!-- Subtle Center Reticle / Target Accent -->
  <g opacity="0.25" stroke="#00f3ff" stroke-width="0.7">
    <circle cx="420" cy="108" r="70" fill="none" stroke-dasharray="6,6" />
    <line x1="330" y1="108" x2="360" y2="108" />
    <line x1="480" y1="108" x2="510" y2="108" />
  </g>

  <!-- CENTER-ORIENTED CONTINUOUS OVERWRITING TEXT SEQUENCE -->
  <!-- 1. MUHAMMAD AZAAN M R -->
  <text x="420" y="112" class="crt-font t1">MUHAMMAD AZAAN M R</text>
  
  <!-- 2. azaanmr -->
  <text x="420" y="112" class="crt-font t2">azaanmr</text>

  <!-- 3. AZN LABS -->
  <text x="420" y="112" class="crt-font t3">AZN LABS</text>

  <!-- Center Monospace Tagline & Blinking Terminal Cursor -->
  <g transform="translate(420, 154)">
    <text x="0" y="0" class="status-sub">&gt; SOFTWARE DEVELOPER &amp; BUILDER &lt;</text>
    <rect x="180" y="-10" width="8" height="13" fill="#00f3ff" class="cursor-box" />
  </g>

  <!-- Bottom Mini Specs Line -->
  <text x="420" y="186" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#4ea1ff" letter-spacing="2" opacity="0.75">
    [ ANDROID // WEB APPS // DEV TOOLS // OFFLINE-FIRST ]
  </text>

  <!-- 90s CRT Scanline Layer -->
  <rect x="8" y="8" width="824" height="204" rx="10" fill="url(#scanlines)" pointer-events="none" />

  <!-- Animated CRT Scan Sweep -->
  <g opacity="0.12" pointer-events="none">
    <rect x="8" y="0" width="824" height="25" fill="#00f3ff" style="animation: scanlineSweep 4.5s infinite linear;" />
  </g>
</svg>
