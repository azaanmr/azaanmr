<svg fill="none" viewBox="0 0 160 42" width="160" height="42" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="btn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190733" />
      <stop offset="100%" stop-color="#0b0217" />
    </linearGradient>
    <linearGradient id="play-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ffe600" />
    </linearGradient>
  </defs>
  <!-- Button Border and Background -->
  <rect width="160" height="42" rx="8" fill="url(#btn-bg)" stroke="#00f3ff" stroke-width="1.5" />
  
  <!-- Play Store Logo Icon (Neon 90s synthwave style) -->
  <g transform="translate(14, 10)">
    <path d="M1 2.5 L12 11 L1 19.5 Z" fill="#00f3ff" />
    <path d="M1 2.5 L14 6 L12 11 Z" fill="#ffe600" />
    <path d="M1 19.5 L14 16 L12 11 Z" fill="#ff007f" />
    <path d="M14 6 L19 11 L14 16 L12 11 Z" fill="#00f3ff" />
  </g>

  <!-- Button Typography -->
  <text x="44" y="16" font-family="'Courier New', Courier, monospace" font-size="9" font-weight="bold" fill="#ff71ce" letter-spacing="1">GET IT ON</text>
  <text x="44" y="30" font-family="'Courier New', Courier, monospace" font-size="12.5" font-weight="900" fill="#00f3ff" letter-spacing="0.5">Google Play</text>
</svg>
